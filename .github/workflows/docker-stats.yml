name: Docker Stats Sync

on:
  schedule:
    # 每小时执行一次
    - cron: '0 * * * *'
  workflow_dispatch:
    # 手动触发

jobs:
  sync-docker-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Docker Hub pull count
        id: docker-hub
        run: |
          # 调用 Docker Hub API 获取拉取次数
          RESPONSE=$(curl -s "https://hub.docker.com/v2/repositories/jackge12345/dbcheck/")
          PULL_COUNT=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('pull_count', 0))")

          echo "Docker Pulls: $PULL_COUNT"
          echo "pull_count=$PULL_COUNT" >> $GITHUB_OUTPUT

      - name: Update docker-stats.json
        run: |
          # 写入 JSON 文件
          cat > docker-stats.json << EOF
          {
            "pull_count": ${{ steps.docker-hub.outputs.pull_count }},
            "updated_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

          cat docker-stats.json

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add docker-stats.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0

          git commit -m "docs: sync Docker Hub pull count"
          git push
